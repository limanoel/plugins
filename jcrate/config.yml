# Action Bar wird Spielern angezeigt, die sich in der Nähe einer Kiste befinden
action-bar:
  # %crate% = Kistenname, %keys% = Anzahl eigener Schlüssel, %uses% = Öffnungen gesamt
  near-crate: "&b&l%crate% &7| &e%keys%x Schlüssel"

confirm-gui:
  title: "&4Kiste löschen: &c%crate%?"
  confirm-item:
    material: LIME_WOOL
    name: "&a&lLÖSCHEN BESTÄTIGEN"
  cancel-item:
    material: RED_WOOL
    name: "&c&lABBRECHEN"

link-tool:
  material: BLAZE_ROD
  name: "&b&lCrate Linker"
  lore:
    - "&7Rechtsklick auf einen Block,"
    - "&7um ihn mit der Kiste zu verlinken."

holograms:
  enabled: true
  height-offset: 1.5
  lines:
    - "&b&l%crate%"
    - "&7Rechtsklick zum Öffnen"


# Accept/Decline Items für Bestätigungen
accept-item:
  material: LIME_WOOL
  name: "&a&lANNEHMEN"
  custom-model-data: 0

decline-item:
  material: RED_WOOL
  name: "&c&lABLEHNEN"
  custom-model-data: 0

