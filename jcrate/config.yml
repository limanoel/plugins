# JustCrates Configuration


messages:
  prefix: "&8[&bJustCrates&8] "
  no-permission: "&cDazu hast du keine Rechte!"
  crate-created: "&aKiste '&e%crate%&a' erfolgreich erstellt!"
  crate-deleted: "&cKiste '&e%crate%&c' wurde gelöscht."
  key-given: "&aDu hast &e%player% &a%amount%x Schlüssel für '&e%crate%&a' gegeben."
  key-created: "&aSchlüssel für '&e%crate%&a' ins Inventar gelegt."
  link-item-given: "&eKlicke auf einen Block, um ihn mit der Kiste '&b%crate%&e' zu verlinken."
  linked-success: "&aBlock erfolgreich mit Kiste '&e%crate%&a' verlinkt!"
